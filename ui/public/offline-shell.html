<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0d1117" />
    <title>Wavey Gist</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/github-markdown.css" />
    <link rel="stylesheet" href="/markdown-theme.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/syntax.css" />
    <link rel="stylesheet" href="/offline-shell.css" />
    <script defer src="/offline-shell.js"></script>
  </head>
  <body class="offline-shell">
    <header class="app-header">
      <div class="app-header-inner">
        <a class="app-brand" href="/" aria-label="waveygist home">
          <span class="brand-mark-strong">wavey</span><span class="brand-mark-light">gist</span>
        </a>
        <nav class="app-nav" aria-label="Site">
          <button class="app-offline-status offline-status" type="button" disabled>Offline</button>
        </nav>
      </div>
    </header>
    <main id="offline-app" class="page-shell" aria-live="polite">
      <p class="empty-state">Loading saved gists…</p>
    </main>
    <noscript>
      <main class="page-shell">
        <p class="empty-state">JavaScript is required to open saved gists.</p>
      </main>
    </noscript>
  </body>
</html>
