[project]
name = "wavey-gist-api"
version = "0.1.0"
description = "Standalone self-hosted Wavey Gist API"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "bleach>=6.2.0",
    "cmarkgfm>=2024.11.20",
    "flask>=3.1.0",
    "gunicorn>=23.0.0",
    "lxml>=5.3.0",
    "python-dotenv>=1.0.1",
    "pywebpush>=2.0.3",
]

[project.scripts]
admin = "gist_api.admin:main"
narration-worker = "gist_api.narration_worker:main"
push-worker = "gist_api.push_worker:main"

[project.optional-dependencies]
narration = [
    "pocket-tts==3.0.2",
    "torch==2.9.1",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "narration" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
